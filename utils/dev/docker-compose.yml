# Dev instance of comic-api (comics-api-dev). utils/deploy.sh dev stages this file with
# utils/remote/run.sh in /root/comics-deploy-dev on the Docker host, which also runs prod.
# Nothing here may be shared with utils/prod/docker-compose.yml: project, containers, volumes
# and host ports all differ (utils/test/run-tests.sh checks this).
name: comics-dev

volumes:
  # Created by run.sh dev if missing (NFS :/volume1/PodGeneral/comics-dev). External, so
  # compose never creates or recreates the volume that holds the dev data.
  comicdata-dev:
    external: true
    name: comicdata-dev

services:
  backend:
    image: registry.stapledon.ca/kkdad/comic-api:${API_TAG}
    pull_policy: always
    container_name: comics-api-dev
    hostname: comics-api-dev
    restart: unless-stopped
    volumes:
      - type: volume
        source: comicdata-dev
        target: /comics
    ports:
      - 8087:8888
    environment:
      - "COMICS_CACHE_LOCATION=/comics"
      # Serve /api/v1/promotion/** to prod's PromoteFromDevJob
      - "COMICS_PROMOTION_SERVE=true"
    # dev-token.env turns on the dev-only devToken mutation; written by run.sh dev, kept on the Docker host.
    # comics-promotion.env holds COMICS_PROMOTION_TOKEN, shared with prod; written by run.sh beside both deploy directories
    env_file:
      - dev-token.env
      - path: ../comics-promotion.env
        required: false

networks:
  default:
    external: true
    name: stapledon-network
