version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      
  - package-ecosystem: "npm"
    directory: "/comic-hub"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"      

  - package-ecosystem: "docker"
    directories:
      - "/comic-api"
      - "/comic-hub"
    schedule:
      interval: "weekly"
    # Stay on the LTS runtimes; move to the next LTS major by hand.
    ignore:
      - dependency-name: "library/eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "library/node"
        update-types: ["version-update:semver-major"]
