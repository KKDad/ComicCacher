version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      
  - package-ecosystem: "npm"
    directory: "/comic-hub"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint supports <6.1 (typescript-eslint#10940); lift once it supports 7
      - dependency-name: "typescript"
        versions: [">=6.1"]
      # Track the Node LTS in .nvmrc; bump the major with the runtime (Node 26 LTS, late October 2026)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"      

  - package-ecosystem: "docker"
    directories:
      - "/comic-api"
      - "/comic-hub"
    schedule:
      interval: "weekly"
    # Stay on the LTS runtimes; move to the next LTS major by hand.
    ignore:
      - dependency-name: "library/eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "library/node"
        update-types: ["version-update:semver-major"]
