name: Java CI with Gradle

# Builds and tests the backend modules. comic-hub has its own workflow, and docs-only
# changes don't need a build.
on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'comic-hub/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/comic-hub.yml'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'comic-hub/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/comic-hub.yml'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    # build runs check: unit tests, the comic-api ITs (the 'integration' task), checkstyle and coverage
    - name: Build with Gradle
      run: ./gradlew build

    - name: Store reports
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: linux-reports
        path: '*/build/reports/'
        retention-days: 5
