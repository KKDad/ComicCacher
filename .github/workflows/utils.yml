name: Utils CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'utils/**'
      - '.github/workflows/utils.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'utils/**'
      - '.github/workflows/utils.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: ShellCheck
      run: |
        shellcheck --version
        shellcheck --severity=warning utils/*.sh utils/test/*.sh utils/lib/*.sh utils/remote/*.sh

    - name: Deploy script tests
      run: utils/test/run-tests.sh
