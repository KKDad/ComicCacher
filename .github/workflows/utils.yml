name: Utils CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'utils/**'
      - 'comic-api/build-docker.sh'
      - 'comic-hub/build-docker.sh'
      - '.github/workflows/utils.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'utils/**'
      - 'comic-api/build-docker.sh'
      - 'comic-hub/build-docker.sh'
      - '.github/workflows/utils.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Scenario files under utils/test/scenarios are data sourced by run-tests.sh, not scripts
    - name: ShellCheck
      run: |
        shellcheck --version
        shellcheck --severity=warning utils/*.sh utils/test/*.sh comic-api/build-docker.sh comic-hub/build-docker.sh

    - name: Deploy script tests
      run: utils/test/run-tests.sh
