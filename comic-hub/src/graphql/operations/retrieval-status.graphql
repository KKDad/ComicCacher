# Retrieval status queries for Comics Hub

fragment RetrievalRecordFields on RetrievalRecord {
  id
  comicDate
  status
  errorMessage
  httpStatusCode
  retrievalDurationMs
  imageSize
  attemptedAt
}

# The retrieval-status page: the latest daily run, today's results and errors, and each comic's result per day
query GetRetrievalHealth($days: Int, $errorLimit: Int) {
  retrievalHealth(days: $days, errorLimit: $errorLimit) {
    targetDate
    lastRun {
      executionId
      jobName
      status
      startTime
      endTime
      durationMs
    }
    sources {
      source
      success
      unavailable
      rateLimited
      failed
    }
    todaysErrors {
      recovered
      record {
        ...RetrievalRecordFields
        comicId
        comicName
        source
      }
    }
    comics {
      comicId
      comicName
      source
      enabled
      active
      indexed
      publicationDays
      newest
      expectedLatest
      stale
      missingStreak
      latestError {
        ...RetrievalRecordFields
      }
      days {
        date
        outcome
        recovered
        record {
          ...RetrievalRecordFields
        }
      }
    }
  }
}
