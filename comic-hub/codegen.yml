overwrite: true
schema: '../comic-api/src/main/resources/graphql/**/*.graphql'
documents: 'src/graphql/operations/**/*.graphql'
generates:
  src/generated/graphql.ts:
    plugins:
      - typescript-operations
      - typescript-react-query
    config:
      scalars:
        Date: string
        DateTime: string
        JSON: any
      enumType: const
      reactQueryVersion: 5
      addInfiniteQuery: true
      exposeQueryKeys: true
      exposeFetcher: true
      fetcher:
        func: '../lib/graphql-client#fetcher'
        isReactHook: false
