server.port=8888
#debug=true
spring.security.user.name=user
spring.security.user.password=voicebox1@
spring.output.ansi.enabled=always
spring.profiles.active=production

# Virtual threads for Tomcat request handling and @Async tasks
spring.threads.virtual.enabled=true

# Logging configuration for API endpoints
logging.level.web=INFO

# Compact stack traces (console and per-execution batch logs): at most 12 frames per exception in the cause chain, framework frames folded away
logging.exception-conversion-word=%wEx{12,org.springframework,org.apache,org.junit,org.gradle,java.lang.reflect,jdk.internal,sun.reflect,io.netty,worker.org.gradle,jakarta.servlet,graphql.execution,reactor.core,io.micrometer.context}

# OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=true

# Actuator - expose health endpoint for Docker health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.operationsSorter=method

# Spring Batch Job Configuration
# Disable auto-run of jobs on startup (jobs are scheduled via @Scheduled annotations)
spring.batch.job.enabled=false

# All jobs run in America/Toronto timezone
batch.timezone=America/Toronto

# Comic Download Job - Downloads all comics daily
batch.comic-download.enabled=true
batch.comic-download.cron=0 0 6 * * ?

# Metrics Archive Job - Archives yesterday's metrics to JSON
batch.metrics-archive.enabled=true
batch.metrics-archive.cron=0 30 6 * * ?

# Image Metadata Backfill Job - Backfills missing image metadata
batch.image-backfill.enabled=true
batch.image-backfill.cron=0 30 6 * * ?
batch.image-backfill.batch-size=100

# Retrieval Record Purge Job - Purges old retrieval records
batch.record-purge.enabled=true
batch.record-purge.cron=0 45 6 * * ?

# Comic Backfill Job - Backfills missing comics
# Runs at every cron time from 90 minutes after the daily download (06:00) until evening. A run with nothing to backfill
# is skipped before any web request and isn't recorded. No catch-up run at startup; the next cron time picks up the work.
batch.comic-backfill.enabled=true
batch.comic-backfill.cron=0 30 7-19/2 * * ?
batch.comic-backfill.chunk-size=10
batch.comic-backfill.max-consecutive-failures=3
batch.comic-backfill.delay-between-comics-ms=10000

# Global defaults for backfill limits
# Each run fills the last recent-days days across all comics first, then older gaps round-robin, up to max-per-run per source.
# max-per-day is an optional ceiling across all of a day's runs (0 = none).
batch.comic-backfill.default-max-per-run=30
batch.comic-backfill.default-max-per-day=0
batch.comic-backfill.default-recent-days=7
batch.comic-backfill.default-max-days-back=365

# Learning from results (backfill-state.json in the cache root)
# A date that comes back unavailable or as another date's image give-up-after times is skipped.
# horizon-consecutive-failures different old dates in a row coming back unavailable set a comic's history horizon; when
# horizon-min-comics comics on a source have horizons within horizon-tolerance-days of each other, that becomes the source's horizon.
# Given-up dates and horizons are retried after retry-given-up-after-days.
batch.comic-backfill.give-up-after=2
batch.comic-backfill.horizon-consecutive-failures=3
batch.comic-backfill.horizon-min-comics=3
batch.comic-backfill.horizon-tolerance-days=2
batch.comic-backfill.retry-given-up-after-days=30

# Remember, for the rest of the day, which strips the backfill scan found on disk, so the 2-hourly checks only recheck gaps.
# It only decides which dates are scanned (never which image is served); the recent window is always checked on disk and a
# mismatch is logged at WARN. Set to false to have every scan check every date on disk.
batch.comic-backfill.remember-cached-strips=true

# Source-specific limits (override defaults)
# GoComics - allows deeper history (older strips still download; a paywall, if any, is learned as a horizon)
batch.comic-backfill.sources.gocomics.max-per-run=30
batch.comic-backfill.sources.gocomics.max-days-back=730

# Comics Kingdom - more limited history
batch.comic-backfill.sources.comicskingdom.max-per-run=15
batch.comic-backfill.sources.comicskingdom.max-days-back=180

# Avatar Backfill Job - Downloads missing avatar images (disabled by default)
batch.avatar-backfill.enabled=true
batch.avatar-backfill.cron=0 15 7 * * ?
batch.avatar-backfill.delay-between-downloads-ms=2000

# Downloader configuration - User-Agent and per-source throttling.
# Each request to a source is paced by a randomized delay between min and max (ms); set max=0 to disable throttling for that source.
# Per-source user-agent overrides are commented out; uncomment to override the global default for a specific source.

# Comicskingdom: minor jitter only (not currently rate-limited).
downloader.sources.comicskingdom.throttle.max-delay-ms=500
downloader.sources.comicskingdom.throttle.min-delay-ms=0
#downloader.sources.comicskingdom.user-agent=

# Freefall: minor jitter only (not currently rate-limited).
downloader.sources.freefall.throttle.max-delay-ms=500
downloader.sources.freefall.throttle.min-delay-ms=0
#downloader.sources.freefall.user-agent=

# GoComics: aggressive throttling to avoid Cloudflare bot detection (8-20s jitter, ~12 min for 50 comics).
downloader.sources.gocomics.throttle.max-delay-ms=20000
downloader.sources.gocomics.throttle.min-delay-ms=8000
# On HTTP 429: retry up to max-attempts total, waiting Retry-After if sent, else 60s doubling per attempt (+jitter), capped at max-backoff-ms.
# The backoff pauses every gocomics request, not just the rejected comic. Sources without retry settings fail on the first 429.
downloader.sources.gocomics.retry.max-attempts=4
downloader.sources.gocomics.retry.initial-backoff-ms=60000
downloader.sources.gocomics.retry.max-backoff-ms=600000
#downloader.sources.gocomics.user-agent=

# Default User-Agent for all outbound HTTP requests. Per-source overrides above.
# Keep the Chrome major version current (https://chromiumdash.appspot.com/releases); a stale version is itself a bot signal.
downloader.user-agent.default-value=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36

# Batch execution tracking - JSON file location and history depth
batch.tracking.json-file=${comics.cache.location}/batch-executions.json
batch.tracking.max-history-per-job=30

# Default cache location - will be normalized to appropriate OS path
# Windows: Uses C:/comics if drive exists, otherwise ~/comics
# Linux/macOS: Uses ~/comics if path starts with a drive letter, otherwise uses as-is
comics.cache.location=${COMICS_CACHE_LOCATION:C:/comics}
comics.cache.config=./comics.json
comics.cache.usersConfig=./users.json
comics.cache.preferencesConfig=./preferences.json
comics.cache.chromeHeadless=true
# Duplicate-image detection (perceptual hashing)
comics.cache.duplicate-detection-enabled=true
comics.cache.hash-algorithm=DIFFERENCE_HASH
# Task execution tracker will store execution data in task-executions.json in the cache location

# JWT Configuration
jwt.secret=your-secret-key-should-be-very-long-and-secure-in-production-environment
jwt.expiration=900000
jwt.refresh-expiration=86400000

# Dev token mutation: issues tokens without a password for testing. Only the dev instance
# turns it on (COMICS_DEVTOKEN_ENABLED, COMICS_DEVTOKEN_SECRET, COMICS_DEVTOKEN_DEFAULTUSERNAME)
comics.dev-token.enabled=false

# Metrics Configuration
# Master enable/disable for metrics collection and persistence
comics.metrics.enabled=true
# How often (seconds) the persistence thread flushes pending metrics
comics.metrics.persist-interval-seconds=300
# How long (days) to retain archived metrics snapshots
comics.metrics.history-retention-days=90
# Subdirectory under the comics cache where archived metrics live
comics.metrics.archive-directory=metrics-history
# Cron expression for the daily archive job
comics.metrics.archive-cron=0 0 3 * * ?
# Color detection: Percentage of pixels to sample for determining if image is B&W or color (0.0-100.0)
comics.metrics.color-detection.sample-percentage=5.0
# Error tracking: Maximum number of errors to keep per comic in last_errors.json
comics.metrics.error-tracking.max-errors-per-comic=5
# Access metrics persistence: Number of accesses before persisting to disk (event-driven, replaces scheduled job)
comics.metrics.persist-threshold=50

# Caffeine Cache Configuration
# Enable/disable Caffeine caching
comics.cache.caffeine.enabled=true

# Metadata cache - stores ComicItem configuration data
comics.cache.caffeine.metadata.max-size=60
comics.cache.caffeine.metadata.ttl-minutes=60

# Predictive lookahead cache configuration
comics.cache.caffeine.lookahead.enabled=false
comics.cache.caffeine.lookahead.count=3

# GraphQL Configuration
# Include both root graphql folder and types subdirectory
spring.graphql.schema.locations=classpath:graphql/,classpath:graphql/types/
spring.graphql.schema.file-extensions=.graphql,.gql
spring.graphql.http.path=/graphql
spring.graphql.http.enabled=true
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.schema.printer.enabled=true
spring.graphql.schema.inspection.enabled=true

spring.graphql.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://10.0.0.83:3001
spring.graphql.cors.allowed-methods=POST,OPTIONS
spring.graphql.cors.allowed-headers=*
spring.graphql.cors.allow-credentials=true

# Mail Configuration (SMTP) — disabled by default
# See TODO.md "Configure SMTP for Password Reset" for setup instructions
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

# Mail service settings
app.mail.from=${MAIL_FROM:noreply@comiccacher.local}
app.mail.reset-url-base=${MAIL_RESET_URL_BASE:http://localhost:3000/reset-password}

# External base URL for generating absolute URLs in API responses
# Used for image URLs that clients will fetch directly
app.external-base-url=