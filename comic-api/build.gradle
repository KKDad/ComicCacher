plugins {
    id "com.coditory.integration-test" version '2.2.5'
    id "io.spring.dependency-management"
    id "org.springframework.boot"
}

// Integration test configuration. The coditory plugin runs the ITs in the 'integration' task;
// 'integrationTest' only aggregates it. The ITs pick their profile with @ActiveProfiles.
integration {
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Ensure main resources (including graphql schema files) are on integration test classpath
// The coditory plugin creates an 'integration' source set but doesn't include main resources by default
sourceSets {
    integration {
        // Add main resources AFTER integration test resources so integration overrides main
        resources.srcDirs = ['src/integration/resources', 'src/main/resources']
    }
}

// Handle duplicate resources - use EXCLUDE to skip duplicates (integration resources take precedence since they're listed first)
processIntegrationResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


configurations {
    integrationTestImplementation {
        extendsFrom implementation
    }
    integrationTestCompileOnly {
        extendsFrom compileOnly
    }
    integrationTestAnnotationProcessor {
        extendsFrom testAnnotationProcessor
        extendsFrom annotationProcessor
    }
    integrationTestRuntimeOnly {
        extendsFrom runtimeOnly
    }
    // Prevent version conflicts
    all*.exclude group: 'com.vaadin.external.google', module: 'android-json'
    all*.exclude group: 'commons-logging', module: 'commons-logging'
}

// repositories inherited from root build.gradle

dependencies {
    // Module dependencies
    implementation project(':comic-common')
    implementation project(':comic-metrics')
    implementation project(':comic-engine')

    // Spring Boot starters - use managed versions
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Carries the logging MDC (request id, user) into GraphQL data fetchers
    implementation 'io.micrometer:context-propagation'

    // GraphQL extended scalars for Date, DateTime, JSON
    implementation 'com.graphql-java:graphql-java-extended-scalars:24.0'

    // Caffeine cache
    implementation "com.github.ben-manes.caffeine:caffeine:${rootProject.ext.caffeineVersion}"

    // H2 database for the Spring Batch job repository (JDBC comes with starter-batch-jdbc)
    runtimeOnly 'com.h2database:h2'


    // JWT dependencies - use consistent versions
    implementation "io.jsonwebtoken:jjwt-api:${rootProject.ext.jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${rootProject.ext.jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${rootProject.ext.jjwtVersion}"

    // Other dependencies
    implementation "org.mindrot:jbcrypt:${rootProject.ext.bcryptVersion}"

    // Annotation processors
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

// Required for Spring Boot 4 Test Autoconfiguration
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

    // Explicitly add them to integrationTest to bypass plugin isolation issues
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
}

tasks.withType(Test).configureEach {
    systemProperty 'spring.profiles.active', 'test'
}

bootRun {
    mainClass = "org.stapledon.ComicApiApplication"

    // Allow command-line arguments to override system properties
    // This ensures bootRun will respect spring.profiles.active when specified via --args
    if (project.hasProperty('args')) {
        args project.args.split(',' as Closure)
    } else {
        systemProperty('spring.profiles.active', 'production')
    }
}

springBoot {
    buildInfo()
}

// Override coverage threshold — ratchet towards 0.80 as tests improve
ext.jacocoCoverageMinimum = 0.40

// Integration test coverage
tasks.register('jacocoIntegrationTestReport', JacocoReport) {
    dependsOn integration
    executionData fileTree(project.layout.buildDirectory).include("/jacoco/integration.exec")
    sourceSets sourceSets.main
    reports {
        xml.required = true
        html.required = true
    }
}

integration {
    finalizedBy jacocoIntegrationTestReport
}

// Combined coverage report
tasks.register('jacocoAllReport', JacocoReport) {
    dependsOn test, integration
    executionData fileTree(project.layout.buildDirectory).include("/jacoco/*.exec")
    sourceSets sourceSets.main
    reports {
        xml.required = true
        html.required = true
    }
}
