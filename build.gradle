// Centralized version management for all modules
plugins {
    id 'org.openrewrite.rewrite' version '7.39.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.springframework.boot' version '4.1.1' apply false
}

ext {
    // Project version (can be overridden via -PbuildVersion=X.Y.Z)
    projectVersion = project.hasProperty('buildVersion') ? project.property('buildVersion') : '2.6.2'

    // Library versions
    bcryptVersion = '0.4'
    brotliDecVersion = '0.1.2'
    caffeineVersion = '3.2.3'
    jackson2Version = '2.21.7'
    jackson3Version = '3.1.7'
    jjwtVersion = '0.13.0'
    jsoupVersion = '1.23.2'
    lombokVersion = '1.18.44'
    tomcatVersion = '11.0.26'
    twelvemonkeysVersion = '3.13.1'

    // Test dependency versions
    jacocoVersion = '0.8.14'

    // Tool versions
    checkstyleVersion = '14.3.0'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'
    apply plugin: 'org.openrewrite.rewrite'

    // Set version from central definition
    version = rootProject.ext.projectVersion
    group = 'kkdad'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // Emit method/constructor parameter names in bytecode so Spring Boot constructor
    // binding (used by @ConfigurationProperties classes) can map property keys to
    // constructor parameters. Required for our immutable Lombok properties classes.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }

    // Default JaCoCo configuration for all subprojects
    jacoco {
        toolVersion = rootProject.ext.jacocoVersion
    }

    // Checkstyle configuration
    checkstyle {
        toolVersion = rootProject.ext.checkstyleVersion
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        configDirectory = rootProject.file('config/checkstyle')
        maxWarnings = 0
    }

    checkstyleMain {
        source = 'src/main/java'
    }

    checkstyleTest {
        source = 'src/test/java'
    }

    // Apply Spring Boot BOM to all modules using dependency-management plugin.
    // BOM_COORDINATES comes from the Spring Boot plugin declared above, so Dependabot's
    // plugin bump is the only Spring Boot version to maintain.
    // Boot 4.1.1 ships Tomcat 11.0.24 (CVEs fixed in 11.0.25). Drop once Boot catches up.
    // Set as a project property so it also covers the BOM import the Boot plugin adds.
    ext['tomcat.version'] = rootProject.ext.tomcatVersion
    // Boot 4.1.1 ships Jackson 2.21.5 / 3.1.5 (DoS CVEs fixed in 2.21.7 / 3.1.7). Drop once Boot catches up.
    ext['jackson-2-bom.version'] = rootProject.ext.jackson2Version
    ext['jackson-bom.version'] = rootProject.ext.jackson3Version

    pluginManager.withPlugin('io.spring.dependency-management') {
        dependencyManagement {
            imports {
                mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            }
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
        // Mockito's inline mock maker is loaded as a javaagent instead of self-attaching (JEP 451)
        mockitoAgent
    }

    dependencies {
        // JUnit Platform Launcher for all subprojects (required by Gradle 8.5+)
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        // Lombok
        compileOnly "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"

        // Common test dependencies
        testImplementation "org.assertj:assertj-core"
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        mockitoAgent('org.mockito:mockito-core') {
            transitive = false
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Same default zone as the containers, so a test that leans on the JVM's zone fails here and in CI alike
        systemProperty 'user.timezone', 'UTC'
        def mockitoAgentFiles = configurations.mockitoAgent
        jvmArgumentProviders.add({ ["-javaagent:${mockitoAgentFiles.singleFile}"] } as CommandLineArgumentProvider)
    }

    test {
        finalizedBy jacocoTestReport
    }

    // The JVM's default zone is UTC in the containers and must not matter: "today" comes from the injected
    // Clock (batch.timezone), stored timestamps are UTC. DateTimeUtils is the one place that reads the JVM's
    // zone, to convert Spring Batch's LocalDateTime values.
    def checkTimeZoneIndependence = tasks.register('checkTimeZoneIndependence') {
        description = 'Fails on main-code calls that depend on the JVM default time zone'
        group = 'verification'
        def sources = fileTree('src/main/java') { include '**/*.java'; exclude '**/common/util/DateTimeUtils.java' }
        inputs.files(sources)
        def forbidden = ~/\b(LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|YearMonth|Year)\.now\(\)|ZoneId\.systemDefault\(\)|Clock\.systemDefaultZone\(\)|TimeZone\.getDefault\(\)/
        doLast {
            def offenders = []
            sources.each { file ->
                file.readLines().eachWithIndex { line, i ->
                    if (line =~ forbidden) {
                        offenders << "${file}:${i + 1}: ${line.trim()}"
                    }
                }
            }
            if (offenders) {
                throw new GradleException("Zone-dependent time calls (use the injected Clock, or ZoneOffset.UTC for stored timestamps):\n" + offenders.join('\n'))
            }
        }
    }
    tasks.named('check') { dependsOn checkTimeZoneIndependence }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                    "**/dto/**",
                    "**/config/properties/**",
                    "**/*Exception.class"
                ])
            }))
        }
    }

    // Per-module coverage thresholds — ratchet towards 0.80
    // Override in module build.gradle: ext.jacocoCoverageMinimum = X.XX
    ext.jacocoCoverageMinimum = 0.80

    afterEvaluate {
        jacocoTestCoverageVerification {
            dependsOn jacocoTestReport
            violationRules {
                rule {
                    limit {
                        counter = 'LINE'
                        value = 'COVEREDRATIO'
                        minimum = project.ext.jacocoCoverageMinimum
                    }
                }
            }
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                    "**/dto/**",
                    "**/config/properties/**",
                    "**/*Exception.class"
                ])
            }))
        }
    }

    rewrite {
        configFile = rootProject.file('rewrite.yaml')
        activeRecipe("com.comiccacher.StyleGuide")
    }
}

// Run all tests across all subprojects and enforce coverage
tasks.register('testAll') {
    dependsOn subprojects.collect { it.path + ':test' }
    dependsOn subprojects.collect { it.path + ':jacocoTestCoverageVerification' }
    dependsOn subprojects.collect { it.path + ':checkTimeZoneIndependence' }
    description = 'Runs all tests and enforces coverage in all subprojects'
    group = 'verification'
}
